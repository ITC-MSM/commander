name: Build platform images

on:
  push:
    branches: [platform]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: platform-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image repository
        shell: bash
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: game-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/backend:platform
            ${{ env.IMAGE_REPO }}/backend:sha-${{ github.sha }}
          build-args: COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=argentum-backend
          cache-to: type=gha,mode=max,scope=argentum-backend
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: web-client
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/frontend:platform
            ${{ env.IMAGE_REPO }}/frontend:sha-${{ github.sha }}
          build-args: COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=argentum-frontend
          cache-to: type=gha,mode=max,scope=argentum-frontend
