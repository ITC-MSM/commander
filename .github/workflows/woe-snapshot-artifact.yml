name: WOE snapshot artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: woe-snapshot-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rebless:
    if: github.head_ref == 'codex/woe-card-batch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Rebless card snapshots
        run: ./gradlew :mtg-sets:test --tests '*CardDefinitionSnapshotTest' -DupdateSnapshots=true
      - name: Upload WOE golden
        uses: actions/upload-artifact@v4
        with:
          name: woe-card-snapshot
          path: mtg-sets/src/test/resources/snapshots/cards/WOE.json
