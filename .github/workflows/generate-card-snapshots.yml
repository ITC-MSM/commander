name: Generate card snapshots

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true
      - uses: actions/upload-artifact@v4
        with:
          name: card-snapshots
          path: |
            mtg-sets/src/test/resources/snapshots/cards/EMN.json
            mtg-sets/src/test/resources/snapshots/cards/MID.json
            mtg-sets/src/test/resources/snapshots/cards/SOI.json
